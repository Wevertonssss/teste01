name: O Robô Inspetor (DevSecOps)

# 1. Quando o robô trabalha? Quando mandamos coisas novas pro GitHub (push).
on:
  push:
    branches: [ "main" ]

jobs:
  inspecionar:
    runs-on: ubuntu-latest

    steps:
    # Passo A: Pega a caixa
      - name: Pega o código
        uses: actions/checkout@v3  # (ou a versão que estiver no seu ficheiro)

      # --- INÍCIO DO BLOCO NOVO QUE VOCÊ VAI ADICIONAR ---
      - name: Configurar Python na esteira
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Instalar o inspetor de código (Bandit)
        run: pip install bandit

      - name: Inspecionar o código Python (SAST)
        run: bandit -r app.py
      # --- FIM DO BLOCO NOVO ---

      # --- O SEU CÓDIGO ANTIGO CONTINUA INTACTO AQUI PARA BAIXO ---
      - name: Ligar o Inspetor Trivy
        # ... (restante da sua configuração do Trivy, Docker, exit-code 0, etc)

    # Passo B: Monta a caixa
    - name: Constrói a caixa do Docker
      run: docker build -t meu-brinquedo:latest .

    # Passo C: O Inspetor Trivy pega a lupa! Se achar defeito CRÍTICO, ele grita e para tudo.
    - name: Ligar o Inspetor Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'meu-brinquedo:latest'
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

    # Passo D: Só chega aqui se o Trivy aprovar!
    - name: Sucesso
      run: echo "O inspetor aprovou! O brinquedo está seguro!"